# CellNucleus - legacy optional Jekyll configuration (the candidate is served as static HTML)

title: CellNucleus.com
description: Nuclear biology education owned and operated by Gnometrix Labs, with 62 indexed research pages and 17 hypothesis reviews.
baseurl: ""
url: "https://cellnucleus.com"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO settings
lang: en_US
author: Gnometrix Labs
email: cellnucleus@gnometrix.com

social:
  name: CellNucleus.com
  links:
    - https://www.gnometrix.com/

# Exclude files from processing
exclude:
  - node_modules/
  - package*.json
  - .gitignore
  - README.md
  - LICENSE
  - .github/
  - docs/deployment-guide.md
  - docs/contributing.md

# Include files
include:
  - _pages
  - assets/

# Collections (if needed for future expansion)
collections:
  reviews:
    output: true
    permalink: /:collection/:name/

# Default settings
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "reviews"
      type: "pages"  
    values:
      layout: "review"

# Site navigation
nav_links:
  - name: Home
    link: /
  - name: Reviews  
    link: /reviews_index.html
  - name: Search
    link: /index.html#site-search
  - name: About
    link: /about.html
  - name: Contact
    link: mailto:cellnucleus@gnometrix.com

# Google Analytics (uncomment and add your tracking ID)
# google_analytics: G-XXXXXXXXXX

# Disqus comments (uncomment and add your shortname)
# disqus:
#   shortname: nuclear-biology-reviews
